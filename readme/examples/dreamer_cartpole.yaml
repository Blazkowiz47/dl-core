seed: 42
deterministic: true

environment:
  name: gymnasium_vector
  id: CartPole-v1
  num_envs: 8
  vectorization_mode: async

evaluation_environment:
  name: gymnasium
  id: CartPole-v1

models:
  world_model:
    name: dreamer_world_model
    embedding_size: 128
    deterministic_size: 128
    stochastic_size: 16
    classes: 16
    hidden_size: 256
  actor:
    name: dreamer_actor
    hidden_size: 256
  critic:
    name: dreamer_critic
    hidden_size: 256

optimizers:
  world_model:
    name: adam
    lr: 0.0001
  actor:
    name: adam
    lr: 0.00003
  critic:
    name: adam
    lr: 0.00003

trainer:
  dreamer:
    total_timesteps: 1000000
    max_episode_steps: 500
    evaluation_frequency: 100
    evaluation_episodes: 5
    checkpoint_frequency: 500
    checkpoint_frequency_steps: 100000
    show_progress: true
    buffer_size: 100000
    batch_size: 16
    sequence_length: 50
    burn_in: 5
    learning_starts: 1000
    train_frequency: 16
    gradient_steps: 1
    imagination_horizon: 15
    gamma: 0.997
    lambda_: 0.95
    actor_unimix: 0.01
    checkpoint_replay_buffer: true

accelerator:
  type: single_gpu
  mixed_precision: bf16

runtime:
  output_dir: artifacts

experiment:
  name: dreamer-cartpole
  run_name: baseline
