[build-system]
requires = ["hatchling>=1.25.0,<1.32"]
build-backend = "hatchling.build"

[project]
name = "deep-learning-core"
version = "0.1.8"
description = "Reusable deep learning framework core."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "blazkowiz47", email = "sushrutpatwardhan@gmail.com" },
]
maintainers = [
    { name = "blazkowiz47", email = "sushrutpatwardhan@gmail.com" },
]
keywords = [
    "deep-learning",
    "machine-learning",
    "pytorch",
    "training",
    "sweeps",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "albumentations>=2.0.8,<3",
    "gymnasium>=1.3,<2",
    "numpy",
    "opencv-python-headless",
    "psutil",
    "pyyaml",
    "scikit-learn",
    "torch>2.3",
    "tomli>=2; python_version < '3.11'",
    "tqdm",
]

[project.optional-dependencies]
webdataset = [
    "webdataset>=1,<2",
]
azure = [
    "deep-learning-azure>=0.0.22,<0.1",
]
mlflow = [
    "deep-learning-mlflow>=0.0.15,<0.1",
]
wandb = [
    "deep-learning-wandb>=0.0.16,<0.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12",
    "torch>2.3",
    "torchvision",
    "twine>=6.0",
    "webdataset>=1,<2",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "dev", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cpu", extra = "dev", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.urls]
Homepage = "https://github.com/Blazkowiz47/dl-core"
Documentation = "https://github.com/Blazkowiz47/dl-core/tree/master/readme"
Repository = "https://github.com/Blazkowiz47/dl-core"
Issues = "https://github.com/Blazkowiz47/dl-core/issues"

[project.scripts]
dl-core = "dl_core.cli:main"
dl-init = "dl_core.init_experiment:main"
dl-init-experiment = "dl_core.init_experiment:main"
dl-inspect-dataset = "dl_core.dataset_inspect:main"
dl-sync = "dl_core.sync:main"
dl-analyze = "dl_core.analysis.sweep_analyzer:main"
dl-analyze-sweep = "dl_core.analysis.sweep_analyzer:main"
dl-migrate = "dl_core.migrate:main"
dl-run = "dl_core.single_run:main"
dl-smoke = "dl_core.smoke:main"
dl-sweep = "dl_core.sweep.runner:main"
dl-train-worker = "dl_core.worker:main"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.tmp-ci-venv",
    "/.venv",
    "/dist",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dl_core"]
include = [
    "src/dl_core/templates/**/*.yaml",
    "src/dl_core/templates/**/*.md",
]
